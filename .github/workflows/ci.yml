name: Synthetic tests and builds

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres16:
    # Hosted disposable runner only. Do not switch to a production/self-hosted host.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install native PostgreSQL 16 and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-16 postgresql-client-16 poppler-utils
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Check, test, and build with isolated synthetic services
        run: bash scripts/ci.sh
